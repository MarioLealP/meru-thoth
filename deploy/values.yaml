# Thoth's deployment, rendered by Argo CD with Meru's nuwa-app chart (>= 0.2.0). CI writes the image after each build.
name: thoth
owner: mario
image:
  repository: zot.clockmost.com/meru/thoth
  digest: sha256:0f61dcffa4c406b46ec157e44bf5b887ca4c77da187054bfd4adcfbbb8ece28e
  tag: "abcb23e2a131"
port: 8080
heartbeat:
  readyPath: /ready # the database answers and every stored row fits the catalog
env:
  # No password in the URL: libpq takes PGUSER/PGPASSWORD from the environment (below).
  THOTH_DATABASE_URL: postgresql+psycopg://thoth-db-rw.thoth.svc:5432/thoth?sslmode=require
  THOTH_ISSUER: https://auth.clockmost.com/application/o/thoth/
  THOTH_JWKS_URL: https://auth.clockmost.com/application/o/thoth/jwks/
  THOTH_AUDIENCE: thoth
  THOTH_PERMISSIONS_CLAIM: thoth_permissions
# The running app's login: rows only, never history or schema (D58).
secretEnv:
  PGUSER:
    secret: thoth-db-runtime
    key: username
  PGPASSWORD:
    secret: thoth-db-runtime
    key: password
# ESO fills the runtime login from OpenBao (apps/meru/thoth/eso/thoth-db-runtime, D66); CNPG's managed role reads
# the same Secret for the password.
externalSecrets:
  thoth-db-runtime:
    type: kubernetes.io/basic-auth
# Migrations log in as the schema owner (CNPG's bootstrap owner Secret).
migrate:
  enabled: true
  command: [.venv/bin/alembic]
  args: [upgrade, head]
  secretEnv:
    PGUSER:
      secret: thoth-db-app
      key: username
    PGPASSWORD:
      secret: thoth-db-app
      key: password
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 384Mi

networkPolicy:
  enabled: true
  hostAddresses: [10.42.0.1/32] # the node: the kubelet's probes and Caddy on the host (no Docker range any more)
  # Its callers inside the cluster; Caddy (thoth.clockmost.com) comes from the node (hostAddresses).
  fromNamespaces: [shikigami, heimdall, anubis, atlas]
  egress: none
  toNamespaces: [thoth] # its own Postgres (thoth-db)
  toAddresses:
    - { cidr: 192.168.10.110/32, ports: [443] } # Caddy: Authentik's JWKS, GlitchTip

# Crash reports (D125): this app's GlitchTip project, which Shikigami made (it predates the marker's own DSN line).
glitchtip:
  dsn: https://b5a029eb36a941d2966363d6b1bda76e@glitchtip.clockmost.com/10

# This app's CI on Meru's runner (Sindri, namespace <app>-build: each job is its own pod). No credentials anywhere
# here. Managed by Meru/nuwa-base (copier): change it there and tag it, Renovate opens the update PR in every app.
# checks: every check scripts/check.sh runs locally - lint, format, types, lockfile, tests.
# build: proves the image builds (BuildKit, nothing pushed) - on pull requests and main alike.
# Releasing is not CI's job: meru-release builds main again in a pod spec this repo can't change, scans it, pushes,
# signs with the app's key and commits the digest (Meru/meru-release). Pull requests never reach a key.
# checks: every check scripts/check.sh runs locally - lint, format, types, tests against a real Postgres (a service
# container, the version CNPG runs), and the API contract against main. No credentials in this pod.
# workflow" (workflow_dispatch).
name: ci
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: [deploy/**]
  workflow_dispatch:

jobs:
  checks:
    runs-on: sindri-check # python 3.15 + uv + git (see the runner's labels)
    services:
      postgres:
        image: docker.io/library/postgres:16.15-trixie@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
        env:
          PGDATA: /tmp/pgdata # runs as a plain user: the image's own data directory isn't ours to take
          POSTGRES_USER: thoth
          POSTGRES_PASSWORD: thoth # a throwaway database inside the job's pod
          POSTGRES_DB: thoth
        options: >-
          --health-cmd "pg_isready -U thoth" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      HOME: /tmp
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PYTHON_DOWNLOADS: never # the image's python only
      THOTH_TEST_DATABASE_URL: postgresql+psycopg://thoth:thoth@localhost:5432/thoth
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD" # the workspace volume isn't owned by the job's user
          git init --quiet .
          git remote add origin "https://sindri:${{ gitea.token }}@git.clockmost.com/${{ gitea.repository }}.git"
          git fetch --quiet origin "${{ gitea.ref }}" # whole history: the checks read commit trailers since main
          git checkout --quiet -B work FETCH_HEAD # (one ref per fetch: FETCH_HEAD is the first ref fetched)
          git fetch --quiet origin "+refs/heads/main:refs/remotes/origin/main" # the contract checks compare against it

      - name: checks
        run: |
          uv sync --frozen
          scripts/check.sh

  build:
    needs: checks
    runs-on: sindri
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init --quiet .
          git remote add origin "https://sindri:${{ gitea.token }}@git.clockmost.com/${{ gitea.repository }}.git"
          git fetch --quiet --depth 1 origin "${{ gitea.ref }}" # a PR's commit lives under refs/pull/<n>/...
          git checkout --quiet -B work FETCH_HEAD

      - name: build
        run: scripts/build.sh build --frontend dockerfile.v0 --local context=. --local dockerfile=.
